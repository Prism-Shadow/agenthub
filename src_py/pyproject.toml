[project]
name = "agenthub-python"
version = "0.4.11"
description = "AgentHub is the LLM API Hub for the Agent era, built for high-precision autonomous agents."
keywords = ["agent", "llm", "gemini", "claude", "gpt"]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["google-genai>=1.70.0", "anthropic[bedrock]>=0.87.0", "flask>=3.0.0", "openai>=2.30.0", "httpx>=0.27.0"]
authors = [
  {name = "PrismShadow"},
]

[project.urls]
Homepage = "https://github.com/Prism-Shadow/agenthub"
Repository = "https://github.com/Prism-Shadow/agenthub"
Issues = "https://github.com/Prism-Shadow/agenthub/issues"

[project.optional-dependencies]
dev = ["httpx[socks]", "pytest>=8.4.2", "pytest-asyncio>=0.23.0", "pytest-xdist>=3.6.0", "pytest-rerunfailures>=15.0", "ruff>=0.14.3", "pillow>=10.0.0"]

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "agenthub"

[tool.ruff]
target-version = "py311"
line-length = 119
indent-width = 4

[tool.ruff.lint]
ignore = ["C901", "E501", "E741", "W605", "C408"]
select = ["C", "E", "F", "I", "W", "RUF022"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
